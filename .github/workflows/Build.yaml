name: Java Matrix CI

on:
  push:
    branches: [testing_java_matrix]
  pull_request:

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          MATRIX=$(jq -c -n \
            --argjson temurin '["17.0.12+7","17.0.13+11","17.0.14+7"," 18.0.2+101","19.0.2+7","20.0.2+9","21.0.4+7.0.LTS","21.0.5+11.0.LTS","21.0.6+7.0.LTS","22.0.2+9","23.0.2+7"]' \
            --argjson zulu '["17.0.2+8","17.0.10+7", "17.0.14+7", "18.0.2+1","19.0.2+7", "20.0.2+9", "21.0.1+12","21.0.1+12","21.0.6+7", "22.0.2+9","23.0.2+7"]' \
            --argjson corretto '["17", "18","19","20","21","22","23"]' \
            --argjson liberica '["17.0.8+7", "17.0.8+1", "17.0.9+11","18.0.2+1","19.0.2+9","20.0.2+10","21.0.4+9","21.0.5+11", "21.0.6+10", "22.0.1+12", "23.0.2+9"]' \
            '{include: (
              ([$temurin[] | {vendor:"temurin", version: .}])
              + ([$zulu[] | {vendor:"zulu", version: .}])
              + ([$corretto[] | {vendor:"corretto", version: .}])
              + ([$liberica[] | {vendor:"liberica", version: .}])
            )}')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Generated matrix: $MATRIX"
        shell: bash
 
 
  test:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java ${{ matrix.version }} from ${{ matrix.vendor }}
        uses: actions/setup-java@v3
        with:
          distribution: ${{ matrix.vendor }}
          java-version: ${{ matrix.version }}

      - name: Verify Java version
        run: java -version

      - name: Run tests
        run: ./gradlew :help