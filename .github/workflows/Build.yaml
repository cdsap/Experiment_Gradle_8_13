name: Java Matrix CI

on:
  push:
    branches: [testing_java_matrix]
  pull_request:

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          MATRIX=$(jq -c -n \
            --argjson temurin '["17.0.8", "17.0.9", "17.0.10", "19.0.2", "19.0.3", "19.0.4", "20.0.1", "20.0.2", "20.0.3", "21.0.0", "21.0.1", "21.0.2"]' \
            --argjson zulu '["17.0.7", "17.0.8", "17.0.9", "19.0.1", "19.0.2", "19.0.3", "20.0.0", "20.0.1", "20.0.2", "21.0.0", "21.0.1"]' \
            --argjson corretto '["17.0.6", "17.0.7", "17.0.8", "19.0.1", "19.0.2", "19.0.3", "21.0.0", "21.0.1"]' \
            --argjson liberica '["17.0.7", "17.0.8", "19.0.2", "19.0.3", "21.0.0", "21.0.1"]' \
            '{include: (
              ([$temurin[] | {vendor:"temurin", version: .}])
              + ([$zulu[] | {vendor:"zulu", version: .}])
              + ([$corretto[] | {vendor:"corretto", version: .}])
              + ([$liberica[] | {vendor:"liberica", version: .}])
            )}')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Generated matrix: $MATRIX"
        shell: bash

  test:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java ${{ matrix.version }} from ${{ matrix.vendor }}
        uses: actions/setup-java@v3
        with:
          distribution: ${{ matrix.vendor }}
          java-version: ${{ matrix.version }}

      - name: Verify Java version
        run: java -version

      - name: Run tests
        run: ./gradlew assembleDebug